x-limiter: &limiter
  image: ratelimiter:local
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 15s
  volumes:
    - ./deploy/rules.cluster.yaml:/etc/ratelimiter/rules.yaml:ro
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  limiter-1:
    <<: *limiter
    build:
      context: .
      dockerfile: deploy/Dockerfile
    pull_policy: build
  limiter-2:
    <<: *limiter
  limiter-3:
    <<: *limiter

  nginx:
    image: nginx:1.28-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "127.0.0.1:${RATELIMITER_HTTP_PORT:-8090}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      limiter-1:
        condition: service_healthy
      limiter-2:
        condition: service_healthy
      limiter-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:${RATELIMITER_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus.cluster.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      limiter-1:
        condition: service_healthy
      limiter-2:
        condition: service_healthy
      limiter-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prometheus-data:
