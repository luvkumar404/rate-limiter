name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 30
    env:
      REDIS_TEST_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Verify modules and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
      - name: Build and vet
        run: |
          go build ./...
          go vet -tags 'integration,chaos,prometheus' ./...
      - name: Unit and Redis integration tests with race detector
        run: go test -race -tags integration -coverprofile=coverage.out ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Validate deployment
        run: docker compose config --quiet
      - name: Build image and start healthy cluster
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify distributed enforcement and Prometheus targets
        run: go run ./cmd/smoke
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Stop test cluster
        if: always()
        run: docker compose down --volumes
