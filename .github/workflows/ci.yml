name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 30
    env:
      REDIS_TEST_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Verify modules and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
      - name: Build and vet
        run: |
          go build ./...
          go vet -tags 'integration,chaos,prometheus' ./...
      - name: Unit and Redis integration tests with race detector
        run: go test -race -tags integration -coverprofile=coverage.out ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  containers:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Validate deployment
        run: docker compose config --quiet
      - name: Build image and start healthy cluster
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify distributed enforcement and Prometheus targets
        run: go run ./cmd/smoke
      - name: Verify 100/minute quota with k6 across three instances
        run: |
          mkdir -p loadtest/results
          chmod 777 loadtest/results
          # Clear proxy peer failures from the backend configuration rollout.
          # Compose starts it again only after all three backends are healthy.
          docker compose stop nginx
          docker compose -f docker-compose.yml -f loadtest/compose.yaml up -d --no-build --wait --wait-timeout 120
          docker compose -f docker-compose.yml -f loadtest/compose.yaml run --rm --no-deps -e MODE=correctness -e OUTPUT=/results/correctness-ci.json k6 run /scripts/check.js
      - name: Preserve k6 correctness result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: k6-correctness
          path: loadtest/results/correctness-ci.json
          if-no-files-found: ignore
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Stop test cluster
        if: always()
        run: docker compose down --volumes
