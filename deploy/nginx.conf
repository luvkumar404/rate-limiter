worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream limiter {
        zone limiter 64k;
        server limiter-1:8080 resolve;
        server limiter-2:8080 resolve;
        server limiter-3:8080 resolve;
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 8k;

        location / {
            proxy_pass http://limiter;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            # A lost reply may follow a committed quota check: never replay it.
            proxy_next_upstream off;
            add_header X-RateLimit-Instance $upstream_addr always;
        }
    }
}
