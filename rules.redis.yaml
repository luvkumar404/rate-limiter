backend: redis
redis:
  addr: localhost:16379
  prefix: ratelimiter
  pool_size: 32
  dial_timeout: 1s
  operation_timeout: 50ms
rules:
  api-default:
    algorithm: token_bucket
    limit: 100
    window: 1m
    burst: 20
    scope: user
  login:
    algorithm: sliding_window
    limit: 5
    window: 1m
    scope: ip
  fixed-demo:
    algorithm: fixed_window
    limit: 10
    window: 1m
    scope: key
failure_policy: fail_open
